# OTA KHÔNG tự chạy khi push. Phát OTA bằng một trong hai cách:
#   - Ở máy: đứng ở nhánh release/v<phiên bản app>, chạy `pnpm code-push-live` (cách chính).
#   - Trên GitHub: Actions > OTA release > Run workflow, chọn nhánh release (dự phòng, không cần token ở máy).
# Bản OTA nhắm vào người dùng đang cài đúng phiên bản app của nhánh đó.
#
# Phiên bản app lấy từ tên nhánh và phải khớp binaryVersion trong ota.config.json (1.0 = 1.0.0), lệch thì dừng
# để không phát nhầm bản. Bản OTA lưu ở GitHub Releases của repo này (release "ota-live"); app đọc ở đó
# (src/app/ota.tsx).
#
# DEPLOY_STATIC_URL: địa chỉ GitHub Pages của bundle mini app (giống scripts/build.local.env). Mặc định là
# https://nganbaonguyen.github.io/electrogo-bundles; muốn đổi thì đặt Variable cùng tên ở
# Settings > Secrets and variables > Actions > Variables.
#
# Khi chạy tay có thể chọn: bản bắt buộc, phát dần theo %, hoặc một nền tảng.
name: OTA release

on:
  workflow_dispatch:
    inputs:
      mandatory:
        description: Bản bắt buộc (app áp dụng ngay)
        type: boolean
        default: false
      rollout:
        description: Phát cho bao nhiêu % người dùng (bỏ trống = 100)
        type: string
        default: ''
      platforms:
        description: Nền tảng
        type: choice
        options: ['ios,android', 'ios', 'android']
        default: 'ios,android'

# Hai lần merge sát nhau không được chạy song song (cùng ghi một file lịch sử phát hành)
concurrency:
  group: ota-live
  cancel-in-progress: false

permissions:
  contents: write # ghi file lên GitHub Releases

jobs:
  ota:
    name: Phát OTA
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Không phát bản đang lỗi: kiểm tra lại ngay trên commit được merge
      - run: pnpm typecheck
      - run: pnpm test --ci

      - name: Phát OTA
        run: pnpm code-push-live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STATIC_URL: ${{ vars.DEPLOY_STATIC_URL || 'https://nganbaonguyen.github.io/electrogo-bundles' }}
          DEPLOY_ENV: live
          OTA_BRANCH: ${{ github.ref_name }}
          OTA_MANDATORY: ${{ inputs.mandatory && 'true' || 'false' }}
          OTA_ROLLOUT: ${{ inputs.rollout }}
          OTA_PLATFORMS: ${{ inputs.platforms || 'ios,android' }}
