# OTA: merge develop vào nhánh release (release/v<phiên bản app>, ví dụ release/v1.0.0) thì tự build JS bundle
# của app host và phát cho người dùng đang cài đúng phiên bản app đó (pnpm code-push-live).
#
# Phiên bản app lấy từ tên nhánh và phải khớp binaryVersion trong ota.config.json (1.0 = 1.0.0), lệch thì dừng
# để không phát nhầm bản. Bản OTA lưu ở GitHub Releases của repo này (release "ota-live"); app đọc ở đó
# (src/app/ota.tsx).
#
# Cần đặt một lần: Settings > Secrets and variables > Actions > Variables > DEPLOY_STATIC_URL
# (địa chỉ GitHub Pages của bundle mini app, giống DEPLOY_STATIC_URL trong scripts/build.local.env).
#
# Chạy tay (Actions > OTA release > Run workflow, chọn nhánh release) để phát bản bắt buộc, phát dần theo %,
# hoặc một nền tảng.
name: OTA release

on:
  push:
    branches: ['release/**']
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'packages/**' # mini app phát hành riêng bằng file .tar trên web phân phối
  workflow_dispatch:
    inputs:
      mandatory:
        description: Bản bắt buộc (app áp dụng ngay)
        type: boolean
        default: false
      rollout:
        description: Phát cho bao nhiêu % người dùng (bỏ trống = 100)
        type: string
        default: ''
      platforms:
        description: Nền tảng
        type: choice
        options: ['ios,android', 'ios', 'android']
        default: 'ios,android'

# Hai lần merge sát nhau không được chạy song song (cùng ghi một file lịch sử phát hành)
concurrency:
  group: ota-live
  cancel-in-progress: false

permissions:
  contents: write # ghi file lên GitHub Releases

jobs:
  ota:
    name: Phát OTA
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Không phát bản đang lỗi: kiểm tra lại ngay trên commit được merge
      - run: pnpm typecheck
      - run: pnpm test --ci

      - name: Phát OTA
        run: pnpm code-push-live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STATIC_URL: ${{ vars.DEPLOY_STATIC_URL }}
          DEPLOY_ENV: live
          OTA_BRANCH: ${{ github.ref_name }}
          OTA_MANDATORY: ${{ inputs.mandatory && 'true' || 'false' }}
          OTA_ROLLOUT: ${{ inputs.rollout }}
          OTA_PLATFORMS: ${{ inputs.platforms || 'ios,android' }}
