buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.6")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Thư viện có code C++ mà không ghi ndkVersion (vd. @bravemobile/react-native-code-push) sẽ dùng NDK mặc định
// của Android Gradle Plugin và tự tải thêm ~1 GB. Ép mọi thư viện dùng chung NDK của dự án (ndkVersion ở trên).
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android.ndkVersion = rootProject.ext.ndkVersion
    }
}
